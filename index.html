<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Street Ball 21</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
  }
  canvas {
    display: block;
    image-rendering: pixelated;
    border: 2px solid #00ffff;
    box-shadow: 0 0 30px #00ffff44;
  }
</style>
</head>
<body>
<canvas id="gameCanvas" width="800" height="500"></canvas>
<script>
// ─── CANVAS SETUP ───────────────────────────────────────────────────────────
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const W = 800, H = 500;

// ─── AUDIO ──────────────────────────────────────────────────────────────────
let audioCtx = null;
let masterGain = null;
let muted = false;
function ensureAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = muted ? 0 : 1;
    masterGain.connect(audioCtx.destination);
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
}
function audioOut() { return masterGain || audioCtx.destination; }
function toggleMute() {
  muted = !muted;
  if (masterGain) masterGain.gain.value = muted ? 0 : 1;
}
function playBounce() {
  ensureAudio();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'square';
  osc.frequency.setValueAtTime(180, audioCtx.currentTime);
  gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
  osc.connect(gain); gain.connect(audioOut());
  osc.start(); osc.stop(audioCtx.currentTime + 0.08);
}
function playScore() {
  ensureAudio();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(600, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.25);
  gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
  osc.connect(gain); gain.connect(audioOut());
  osc.start(); osc.stop(audioCtx.currentTime + 0.25);
}
function playMiss() {
  ensureAudio();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(80, audioCtx.currentTime);
  gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
  osc.connect(gain); gain.connect(audioOut());
  osc.start(); osc.stop(audioCtx.currentTime + 0.2);
}
function playWinJingle() {
  ensureAudio();
  const notes = [523, 659, 784, 1047, 1319];
  notes.forEach((freq, i) => {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime + i * 0.12);
    gain.gain.setValueAtTime(0, audioCtx.currentTime + i * 0.12);
    gain.gain.linearRampToValueAtTime(0.25, audioCtx.currentTime + i * 0.12 + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + i * 0.12 + 0.15);
    osc.connect(gain); gain.connect(audioOut());
    osc.start(audioCtx.currentTime + i * 0.12);
    osc.stop(audioCtx.currentTime + i * 0.12 + 0.15);
  });
}
function playSwish() {
  ensureAudio();
  const bufferSize = audioCtx.sampleRate * 0.25;
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1);
  const noise = audioCtx.createBufferSource();
  noise.buffer = buffer;
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'bandpass';
  filter.frequency.setValueAtTime(4000, audioCtx.currentTime);
  filter.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.22);
  filter.Q.value = 2;
  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(0.35, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.22);
  noise.connect(filter); filter.connect(gain); gain.connect(audioOut());
  noise.start();
}
function playBuzzer() {
  ensureAudio();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(110, audioCtx.currentTime);
  gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
  gain.gain.setValueAtTime(0.25, audioCtx.currentTime + 0.5);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.7);
  osc.connect(gain); gain.connect(audioOut());
  osc.start(); osc.stop(audioCtx.currentTime + 0.7);
}
function playBeep(freq) {
  ensureAudio();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'square';
  osc.frequency.setValueAtTime(freq || 880, audioCtx.currentTime);
  gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
  osc.connect(gain); gain.connect(audioOut());
  osc.start(); osc.stop(audioCtx.currentTime + 0.08);
}
function playFireWhoosh() {
  ensureAudio();
  const bufferSize = audioCtx.sampleRate * 0.5;
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1);
  const noise = audioCtx.createBufferSource();
  noise.buffer = buffer;
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.setValueAtTime(400, audioCtx.currentTime);
  filter.frequency.exponentialRampToValueAtTime(3000, audioCtx.currentTime + 0.4);
  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
  noise.connect(filter); filter.connect(gain); gain.connect(audioOut());
  noise.start();
}

// ─── CHIPTUNE BACKGROUND BEAT ───────────────────────────────────────────────
let beat = { playing: false, gain: null, intervalId: null, step: 0 };
const BASSLINE = [55, 55, 82.4, 55, 73.4, 55, 82.4, 98]; // A1-based riff
function startBeat() {
  ensureAudio();
  if (beat.playing) return;
  beat.playing = true;
  beat.step = 0;
  beat.gain = audioCtx.createGain();
  beat.gain.gain.value = 0.12;
  beat.gain.connect(audioOut());
  const stepDur = 200; // ms, ~150bpm eighth notes
  beat.intervalId = setInterval(() => {
    if (!audioCtx) return;
    const t = audioCtx.currentTime;
    // Bass
    const bassFreq = BASSLINE[beat.step % BASSLINE.length];
    const bosc = audioCtx.createOscillator();
    const bg = audioCtx.createGain();
    bosc.type = 'triangle';
    bosc.frequency.setValueAtTime(bassFreq, t);
    bg.gain.setValueAtTime(0.5, t);
    bg.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
    bosc.connect(bg); bg.connect(beat.gain);
    bosc.start(t); bosc.stop(t + 0.18);
    // Hi-hat-ish blip on offbeats
    if (beat.step % 2 === 1) {
      const hosc = audioCtx.createOscillator();
      const hg = audioCtx.createGain();
      hosc.type = 'square';
      hosc.frequency.setValueAtTime(1200, t);
      hg.gain.setValueAtTime(0.06, t);
      hg.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
      hosc.connect(hg); hg.connect(beat.gain);
      hosc.start(t); hosc.stop(t + 0.05);
    }
    beat.step++;
  }, stepDur);
}
function stopBeat() {
  if (!beat.playing) return;
  beat.playing = false;
  clearInterval(beat.intervalId);
  beat.intervalId = null;
  if (beat.gain) { try { beat.gain.disconnect(); } catch(e){} beat.gain = null; }
}

// ─── CONSTANTS ───────────────────────────────────────────────────────────────
const GRAVITY = 0.35;
const BALL_R = 12;
const FLOOR_Y = 380;
const WINNING_SCORE = 21;

// Court bounds for players
const COURT_LEFT = 40;
const COURT_RIGHT = W - 40;

// Hoops. Player attacks RIGHT (CPU_HOOP), CPU attacks LEFT (PLAYER_HOOP).
const CPU_HOOP  = { backboardX: 720, rimY: 220, rimX1: 660, rimX2: 700 };
const PLAYER_HOOP = { backboardX: 80,  rimY: 220, rimX1: 100, rimX2: 140 };

// Player physics constants
const P_W = 28, P_H = 60;
const RUN_ACCEL = 0.9;
const RUN_MAX = 4.4;
const FRICTION = 0.78;
const JUMP_V = -8.6;

function hoopCenter(h) { return { x: (h.rimX1 + h.rimX2) / 2, y: h.rimY }; }
// Three-point distance (matches the drawn arcs of radius 160)
const THREE_DIST = 158;

// ─── GAME STATE ──────────────────────────────────────────────────────────────
const STATE = {
  MENU: 'MENU', PLAYING: 'PLAYING', GAME_OVER: 'GAME_OVER'
};
let gameState = STATE.MENU;

let playerScore = 0;
let cpuScore = 0;

// possession: 'player' | 'cpu' | 'loose'
let possession = 'loose';
// who last shot/touched the ball (for out-of-bounds awarding)
let lastShooter = 'player';
// who the current live shot belongs to (the attacker at release) — drives which hoop scores
let shotOwner = null;

// Entities
function makeEntity(x, dir) {
  return {
    x, y: FLOOR_Y - P_H, vx: 0, vy: 0,
    onGround: true, facing: dir,
    // animation
    runPhase: 0, shootAnim: 0, jumpAnim: 0,
    // cooldowns
    stealCd: 0, shootCd: 0,
    // shooting (player charge)
    charging: false, power: 0
  };
}
let player = makeEntity(200, 1);
let cpu = makeEntity(580, -1);

// Ball
let ball = { x: 0, y: 0, vx: 0, vy: 0, rotation: 0, active: false, settleTimer: 0 };
let ballTrail = [];
let dribblePhase = 0;

// Screen shake
let shakeX = 0, shakeY = 0, shakeMag = 0;

// Particles
let particles = [];

// Popup text
let popup = { text: '', x: 0, y: 0, timer: 0, color: '#fff' };

// Score flash
let scoreFlash = { who: '', timer: 0 };

// "Check ball" pause after a make (brief, not a freeze)
let checkTimer = 0;
// Pending change-of-possession after a make/miss/OOB. checkPending = side to
// receive the ball; checkDelay counts down before we hand it over (lets the
// scoring/miss FX breathe without a freeze).
let checkPending = null;
let checkDelay = 0;
// X position where the live shot was released (drives 2 vs 3 point scoring).
let shotReleaseX = 0;
// Whether the current loose-shot's miss has been registered (streak reset).
let missRegistered = false;

// ─── ARCADE STATE (combos, fire, announcer, juice, clock, difficulty) ────────
// Combo / fire mode tracked per shooter
let streak = { player: 0, cpu: 0 };
let onFire = { player: false, cpu: false };

// Announcer big callout
let callout = { text: '', timer: 0, color: '#ffff00', hot: false };

// Screen flash overlay
let flash = { timer: 0, color: '#ffffff', max: 0 };

// Hit-stop / slow-motion frames remaining
let hitStop = 0;

// Rim flash + shake per hoop (keyed by hoop ref via side string)
let rimFx = { CPU: { flash: 0, shake: 0 }, PLAYER: { flash: 0, shake: 0 } };

// Net swish animation per hoop
let netFx = { CPU: 0, PLAYER: 0 };

// Crowd reaction (brighten/jump)
let crowdHype = 0;

// Floating score text (+2 / +3)
let floaters = [];

// Confetti for win celebration
let confetti = [];

// Track whether the current shot touched the rim (for swish detection)
let touchedRim = false;

// Shot clock (frames; 60fps). Possession clock — violation = turnover.
const SHOT_CLOCK_MAX = 14 * 60;
let shotClock = SHOT_CLOCK_MAX;
let lastClockBeepSec = -1;

// Difficulty: accuracy = base shot scatter; speed/aggression scale CPU.
const DIFFICULTIES = [
  { name: 'ROOKIE',  acc: 0.55, speed: 0.78, aggr: 0.5, steal: 0.004, contest: 0.5 },
  { name: 'PRO',     acc: 0.74, speed: 0.92, aggr: 0.8, steal: 0.010, contest: 0.8 },
  { name: 'ALL-STAR',acc: 0.88, speed: 1.04, aggr: 1.0, steal: 0.018, contest: 1.0 }
];
let difficultyIndex = 1;
function diff() { return DIFFICULTIES[difficultyIndex]; }

// Menu demo ball
let demoBall = { x: W/2, y: FLOOR_Y - 20, vy: 0 };

// Global time counter for animations
let gameTime = 0;

// Stars (static)
const stars = [];
for (let i = 0; i < 50; i++) {
  stars.push({ x: Math.random() * W, y: Math.random() * 200, r: Math.random() * 1.5 + 0.5, bright: Math.random() });
}

// City skyline blocks
const skyline = [];
const skylineColors = ['#0a0a1a', '#0d0d22', '#080818'];
let sx = 0;
while (sx < W) {
  const bw = Math.random() * 35 + 15;
  const bh = Math.random() * 80 + 30;
  skyline.push({ x: sx, y: 300 - bh, w: bw, h: bh, color: skylineColors[Math.floor(Math.random() * 3)] });
  sx += bw + Math.random() * 5;
}

// Crowd silhouettes
const crowd = [];
for (let i = 0; i < 40; i++) {
  crowd.push({ x: i * 22 + Math.random() * 10, y: 55 + Math.random() * 15, r: 7 + Math.random() * 4 });
}

// ─── INPUT ───────────────────────────────────────────────────────────────────
const keys = {};
document.addEventListener('keydown', e => {
  if (!keys[e.code]) {
    keys[e.code] = true;
    onKeyDown(e.code);
  }
  // Prevent page scroll
  if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
});
document.addEventListener('keyup', e => {
  keys[e.code] = false;
  onKeyUp(e.code);
});

function onKeyDown(code) {
  ensureAudio();
  if (code === 'KeyM') { toggleMute(); return; }
  if (gameState === STATE.MENU) {
    if (code === 'ArrowUp')   { difficultyIndex = Math.max(0, difficultyIndex - 1); playBeep(660); return; }
    if (code === 'ArrowDown') { difficultyIndex = Math.min(DIFFICULTIES.length - 1, difficultyIndex + 1); playBeep(660); return; }
    if (code === 'Enter') { startGame(); return; }
    return;
  }
  if (gameState === STATE.GAME_OVER && code === 'Enter') { startGame(); return; }
  if (gameState !== STATE.PLAYING) return;

  // Jump
  if ((code === 'ArrowUp' || code === 'KeyW') && player.onGround) {
    player.vy = JUMP_V; player.onGround = false; player.jumpAnim = 1;
  }
  // Space: shoot (if holding) or defensive action (steal/block)
  if (code === 'Space') {
    if (possession === 'player') {
      player.charging = true;
    } else {
      attemptDefense(player, cpu);
    }
  }
}

function onKeyUp(code) {
  if (gameState !== STATE.PLAYING) return;
  if (code === 'Space' && player.charging) {
    player.charging = false;
    shootBall(player, 'player');
  }
}

// ─── GAME LOGIC ──────────────────────────────────────────────────────────────
function startGame() {
  playerScore = 0; cpuScore = 0;
  particles = []; ballTrail = [];
  popup.timer = 0; scoreFlash.timer = 0;
  streak = { player: 0, cpu: 0 };
  onFire = { player: false, cpu: false };
  callout.timer = 0; flash.timer = 0; hitStop = 0; crowdHype = 0;
  floaters = []; confetti = [];
  rimFx = { CPU: { flash: 0, shake: 0 }, PLAYER: { flash: 0, shake: 0 } };
  netFx = { CPU: 0, PLAYER: 0 };
  shotClock = SHOT_CLOCK_MAX;
  lastClockBeepSec = -1;
  player = makeEntity(200, 1);
  cpu = makeEntity(580, -1);
  // Clear any pending handover/check state left over from a prior game.
  checkPending = null; checkDelay = 0; checkTimer = 0;
  possession = 'loose'; shotOwner = null; ball.active = false;
  // Player starts with the ball
  giveBall('player', false);
  startBeat();
  gameState = STATE.PLAYING;
}

// Hand the ball to a side and reset to a check spot near their defended end.
function giveBall(who, doCheck) {
  possession = who;
  shotOwner = null;
  ball.active = false;
  ball.vx = 0; ball.vy = 0; ball.settleTimer = 0;
  ballTrail = [];
  player.charging = false; player.power = 0;
  cpu.charging = false; cpu.power = 0;
  cpu.aiState = 'idle';
  if (doCheck) {
    // Reset to check positions near center
    if (who === 'player') { player.x = 320; cpu.x = 460; }
    else { cpu.x = 480; player.x = 340; }
    player.vx = 0; cpu.vx = 0;
    player.y = FLOOR_Y - P_H; cpu.y = FLOOR_Y - P_H;
    player.vy = 0; cpu.vy = 0;
    player.onGround = true; cpu.onGround = true;
    checkTimer = 50;
    showCallout('CHECK BALL', '#00ffff', false);
  }
  shotClock = SHOT_CLOCK_MAX;
  lastClockBeepSec = -1;
  attachBallToHolder();
}

function holderEntity() {
  if (possession === 'player') return player;
  if (possession === 'cpu') return cpu;
  return null;
}

// Stick the ball to the holder's hands with a dribble bob.
function attachBallToHolder() {
  const h = holderEntity();
  if (!h) return;
  const cx = h.x;
  const handY = h.y + 14;
  let bob = 0;
  if (h.onGround && Math.abs(h.vx) > 0.3) {
    bob = Math.abs(Math.sin(dribblePhase)) * 16;
  }
  ball.x = cx + h.facing * 16;
  ball.y = handY + bob;
  ball.vx = 0; ball.vy = 0;
  ball.rotation += 0.1;
}

// Begin a shot from entity e belonging to side 'who'.
function shootBall(e, who) {
  if (possession !== who) return;
  const hoop = who === 'player' ? CPU_HOOP : PLAYER_HOOP;
  const tgt = hoopCenter(hoop);
  const releaseX = e.x + e.facing * 14;
  const releaseY = e.y + 6;

  // Power: player uses charge (0..1); CPU computes accuracy-scattered ideal.
  let pwr;
  if (who === 'player') {
    pwr = 0.55 + (e.power / 100) * 0.55; // multiplier on computed ideal
  } else {
    pwr = 1.0;
  }

  // Compute an arcing velocity that reaches the rim. Choose a flight time
  // based on distance, then solve vx, vy from kinematics.
  const dx = tgt.x - releaseX;
  const dy = tgt.y - releaseY;
  const dist = Math.abs(dx);
  const T = Math.max(28, Math.min(70, 26 + dist * 0.10)); // frames of flight
  let vx = dx / T;
  let vy = (dy - 0.5 * GRAVITY * T * T) / T;

  // Layup / dunk: very close to the rim → near-automatic, ignore charge.
  const layup = dist < 90;
  // Player charge tweaks the strength (under/over shoots if not ideal)
  if (who === 'player' && !layup) {
    vx *= pwr; vy *= pwr;
  }

  // Accuracy scatter (CPU based on difficulty; player tiny base scatter)
  let scatter;
  if (who === 'cpu') {
    const a = diff().acc;
    scatter = (1 - a) * 0.9;
    if (cpuScore >= 15) scatter *= 0.7; // clutch
  } else {
    // Player accuracy depends on how close charge is to ideal (1.0) and contest
    const chargeErr = Math.abs(pwr - 1.0);
    scatter = 0.05 + chargeErr * 0.6;
    if (isContested(player, cpu)) scatter += 0.18;
  }
  if (layup) scatter = isContested(e, e === player ? cpu : player) ? 0.18 : 0.04;
  vx += (Math.random() - 0.5) * scatter * 3.2;
  vy += (Math.random() - 0.5) * scatter * 3.2;

  ball.x = releaseX; ball.y = releaseY;
  ball.vx = vx; ball.vy = vy;
  ball.active = true;
  ball.settleTimer = 0;
  touchedRim = false;
  missRegistered = false;
  shotReleaseX = releaseX;
  possession = 'loose';
  shotOwner = who;
  lastShooter = who;
  e.shootAnim = 1;
  e.shootCd = 24;
  ballTrail = [];
  playBounce();
}

// Is the shooter being contested (defender close & in the air or very near)?
function isContested(shooter, defender) {
  const dx = Math.abs(shooter.x - defender.x);
  const dy = Math.abs(shooter.y - defender.y);
  return dx < 46 && dy < 70;
}

// Defensive action: steal if near ball-handler on ground; block if jumping near shooter/ball.
function attemptDefense(me, opp) {
  if (me.stealCd > 0) return;
  me.stealCd = 30;
  // Block: if airborne and near a live shot in the air
  if (!me.onGround && ball.active && shotOwner && shotOwner !== sideOf(me)) {
    const dx = Math.abs(ball.x - me.x);
    const dy = Math.abs(ball.y - (me.y + 6));
    if (dx < 34 && dy < 40) {
      // Knock loose
      ball.vx = (ball.x < me.x ? -1 : 1) * 3 + (Math.random()-0.5)*2;
      ball.vy = 2 + Math.random()*2;
      touchedRim = true;
      shotOwner = null;
      shakeMag = 6;
      showCallout('REJECTED!', '#00ffff', false);
      playBounce();
      return;
    }
  }
  // Steal: opponent holds ball and we're adjacent
  if (possession === sideOf(opp)) {
    const dx = Math.abs(me.x - opp.x);
    if (dx < 40 && me.onGround) {
      const chance = sideOf(me) === 'player' ? 0.16 : diff().steal * 18;
      if (Math.random() < chance) {
        loosenBall(me.facing);
        showCallout('STEAL!', '#ffff00', false);
        playBounce();
      }
    }
  }
}

function sideOf(e) { return e === player ? 'player' : 'cpu'; }

// Knock the held ball loose with a small pop.
function loosenBall(dir) {
  const h = holderEntity();
  if (h) { ball.x = h.x; ball.y = h.y + 10; }
  ball.vx = (dir || 1) * (2 + Math.random()*2);
  ball.vy = -2 - Math.random()*2;
  ball.active = true;
  ball.settleTimer = 0;
  possession = 'loose';
  shotOwner = null;
  missRegistered = true;
}

// ─── ENTITY UPDATE ───────────────────────────────────────────────────────────
function applyEntityPhysics(e) {
  e.vy += GRAVITY;
  e.x += e.vx;
  e.y += e.vy;
  if (e.x < COURT_LEFT) { e.x = COURT_LEFT; e.vx = 0; }
  if (e.x > COURT_RIGHT) { e.x = COURT_RIGHT; e.vx = 0; }
  if (e.y >= FLOOR_Y - P_H) {
    e.y = FLOOR_Y - P_H;
    if (!e.onGround) e.jumpAnim = 0;
    e.vy = 0; e.onGround = true;
  } else {
    e.onGround = false;
  }
  if (e.onGround) {
    e.vx *= FRICTION;
    if (Math.abs(e.vx) < 0.1) e.vx = 0;
    if (Math.abs(e.vx) > 0.3) e.runPhase += 0.3; else e.runPhase = 0;
  }
  if (e.stealCd > 0) e.stealCd--;
  if (e.shootCd > 0) e.shootCd--;
  if (e.shootAnim > 0) e.shootAnim = Math.max(0, e.shootAnim - 0.08);
}

function updatePlayerControls() {
  if (checkTimer > 0) return; // brief check pause, no movement
  if (keys['ArrowLeft'])  { player.vx -= RUN_ACCEL; player.facing = -1; }
  if (keys['ArrowRight']) { player.vx += RUN_ACCEL; player.facing = 1; }
  player.vx = Math.max(-RUN_MAX, Math.min(RUN_MAX, player.vx));
  if (player.charging && possession === 'player') {
    player.power = Math.min(100, player.power + 2.2);
  }
}

// ─── CPU AI (state machine) ─────────────────────────────────────────────────
function updateCpuAI() {
  if (checkTimer > 0) return;
  const d = diff();
  const spd = RUN_ACCEL * d.speed;
  const myHoop = PLAYER_HOOP;             // CPU attacks left
  const defHoop = CPU_HOOP;               // CPU defends right
  const tgt = hoopCenter(myHoop);

  if (possession === 'cpu') {
    // OFFENSE: drive toward left hoop, avoid defender, shoot when in range/open
    cpu.facing = -1;
    const distToRim = Math.abs(cpu.x - tgt.x);
    const contested = isContested(cpu, player);
    const inRange = distToRim < 270;
    const goodSpot = distToRim < 200 && distToRim > 70;

    // Decide to shoot
    if (cpu.shootCd <= 0 && cpu.onGround) {
      const wantShoot =
        (goodSpot && (!contested || Math.random() < 0.02 * d.aggr)) ||
        (distToRim < 110 && Math.random() < 0.05) || // drive layup
        (inRange && !contested && Math.random() < 0.025 * d.aggr);
      if (wantShoot) {
        // jump shot unless very close (layup) — jump if defender contesting
        if (contested || distToRim > 130) { cpu.vy = JUMP_V; cpu.onGround = false; cpu.jumpAnim = 1; }
        shootBall(cpu, 'cpu');
        return;
      }
    }

    // Movement: drive toward rim but keep a small standoff if defender directly between
    let aimX = tgt.x + 90; // shoot from a bit out from the rim
    if (distToRim < 150) aimX = tgt.x + 110;
    const desired = aimX;
    if (cpu.x > desired + 6) cpu.vx -= spd;
    else if (cpu.x < desired - 6) cpu.vx += spd;
    // juke: if defender very close, randomly burst opposite
    if (Math.abs(cpu.x - player.x) < 34 && Math.random() < 0.04 * d.aggr) {
      cpu.vx += (Math.random() < 0.5 ? -1 : 1) * spd * 3;
    }
  } else if (possession === 'player') {
    // DEFENSE: stay between player and the right hoop (CPU's defended end)
    cpu.facing = player.x < cpu.x ? -1 : 1;
    const guardX = (player.x + hoopCenter(defHoop).x) / 2 + 18;
    if (cpu.x > guardX + 8) cpu.vx -= spd;
    else if (cpu.x < guardX - 8) cpu.vx += spd;
    // Contest: jump if player is shooting (charging) and close
    if (player.charging && Math.abs(cpu.x - player.x) < 60 && cpu.onGround
        && Math.random() < 0.06 * d.contest) {
      cpu.vy = JUMP_V; cpu.onGround = false; cpu.jumpAnim = 1;
    }
    // Steal attempt when adjacent
    if (Math.abs(cpu.x - player.x) < 38 && cpu.stealCd <= 0 && Math.random() < d.steal) {
      attemptDefense(cpu, player);
    }
  } else {
    // LOOSE: chase the ball
    cpu.facing = ball.x < cpu.x ? -1 : 1;
    if (cpu.x > ball.x + 6) cpu.vx -= spd;
    else if (cpu.x < ball.x - 6) cpu.vx += spd;
    // jump for a high loose ball
    if (ball.y < FLOOR_Y - 90 && Math.abs(cpu.x - ball.x) < 50 && cpu.onGround && Math.random() < 0.1) {
      cpu.vy = JUMP_V; cpu.onGround = false; cpu.jumpAnim = 1;
    }
  }
  cpu.vx = Math.max(-RUN_MAX * d.speed, Math.min(RUN_MAX * d.speed, cpu.vx));
}

// ─── REBOUND / PICKUP ─────────────────────────────────────────────────────────
function tryPickup(e, who) {
  if (possession !== 'loose' || !ball.active) return false;
  // Can't immediately re-grab your own shot until it's clearly missed (settle window handles that)
  const dx = Math.abs(ball.x - e.x);
  const dy = ball.y - (e.y + 6);
  if (dx < 24 && dy > -30 && dy < 50) {
    possession = who;
    lastShooter = who;
    ball.active = false;
    ball.settleTimer = 0;
    shotOwner = null;
    shotClock = SHOT_CLOCK_MAX;
    lastClockBeepSec = -1;
    return true;
  }
  return false;
}

// ─── PARTICLES ───────────────────────────────────────────────────────────────
function spawnParticles(x, y) {
  const colors = ['#ff6600','#ffaa00','#ff0066','#00ffff','#ffffff','#ffff00'];
  for (let i = 0; i < 12; i++) {
    const angle = (Math.PI * 2 * i / 12) + Math.random() * 0.4;
    const speed = Math.random() * 4 + 2;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 2,
      life: 1,
      decay: Math.random() * 0.03 + 0.02,
      color: colors[Math.floor(Math.random() * colors.length)],
      r: Math.random() * 5 + 2
    });
  }
}

function showPopup(text, x, y, color) {
  popup.text = text; popup.x = x; popup.y = y;
  popup.timer = 90; popup.color = color || '#ffffff';
}

// ─── ARCADE FX HELPERS ───────────────────────────────────────────────────────
const MAKE_CALLS = ['BOOMSHAKALAKA!','SWISH!','NOTHIN\' BUT NET!','BANG!','COUNT IT!'];
const HOT_CALLS  = ['HE\'S ON FIRE!','RAZZLE DAZZLE!','FROM DOWNTOWN!','UNCONSCIOUS!','BOOMSHAKALAKA!'];
const MISS_CALLS_RIM = ['OFF THE RIM!','BRICK!','NO GOOD!'];
const MISS_CALLS_AIR = ['AIRBALL!','WAY OFF!','BRICK!'];

function showCallout(text, color, hot) {
  callout.text = text;
  callout.timer = 75;
  callout.color = color || '#ffff00';
  callout.hot = !!hot;
}
function screenFlash(color, strength) {
  flash.color = color || '#ffffff';
  flash.max = strength || 0.5;
  flash.timer = 12;
}
function addFloater(text, x, y, color) {
  floaters.push({ text, x, y, vy: -1.2, life: 70, color });
}
function spawnConfetti() {
  const cols = ['#ff0066','#00ffff','#ffff00','#00ff66','#ff6600','#ffffff','#aa44ff'];
  for (let i = 0; i < 160; i++) {
    confetti.push({
      x: Math.random() * W, y: -Math.random() * 200,
      vx: (Math.random() - 0.5) * 2, vy: Math.random() * 2 + 1,
      r: Math.random() * 4 + 2, color: cols[Math.floor(Math.random()*cols.length)],
      rot: Math.random() * Math.PI, vr: (Math.random()-0.5)*0.3, life: 1
    });
  }
}
function spawnFireParticle(x, y) {
  const cols = ['#ff3300','#ff6600','#ffaa00','#ffdd33'];
  particles.push({
    x: x + (Math.random()-0.5)*10, y: y + (Math.random()-0.5)*10,
    vx: (Math.random()-0.5)*1.5, vy: -Math.random()*2 - 1,
    life: 1, decay: Math.random()*0.05 + 0.04,
    color: cols[Math.floor(Math.random()*cols.length)],
    r: Math.random()*5 + 3, fire: true
  });
}

// ─── PHYSICS & COLLISION ─────────────────────────────────────────────────────
function checkScore(hoop) {
  // Fire mode gives the shooter a slightly wider rim tolerance (small bonus).
  const fireBonus = (shotOwner && onFire[shotOwner]) ? 2 : 0;
  const inner1 = hoop.rimX1 + 4 - fireBonus;
  const inner2 = hoop.rimX2 - 4 + fireBonus;
  // Use a swept vertical window equal to the ball's radius plus the rim
  // thickness so fast-moving balls don't tunnel through the detection plane.
  const tolerance = BALL_R + 6;
  if (ball.vy > 0 &&
      Math.abs(ball.y - hoop.rimY) < tolerance &&
      ball.x > inner1 && ball.x < inner2) {
    return true;
  }
  return false;
}
// A swish = clean make through the center without ever touching the rim.
function isSwish(hoop) {
  const cx = (hoop.rimX1 + hoop.rimX2) / 2;
  const centerWindow = 12;
  return !touchedRim && Math.abs(ball.x - cx) < centerWindow;
}

function checkRimCollision(hoop) {
  const pts = [
    { x: hoop.rimX1, y: hoop.rimY },
    { x: hoop.rimX2, y: hoop.rimY }
  ];
  for (const pt of pts) {
    const dx = ball.x - pt.x;
    const dy = ball.y - pt.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist < BALL_R + 5 && dist > 0) {
      const nx = dx / dist, ny = dy / dist;
      const dot = ball.vx * nx + ball.vy * ny;
      ball.vx = (ball.vx - 2 * dot * nx) * 0.5;
      ball.vy = (ball.vy - 2 * dot * ny) * 0.5;
      ball.x  = pt.x + nx * (BALL_R + 5);
      ball.y  = pt.y + ny * (BALL_R + 5);
      shakeMag = 4;
      touchedRim = true;
      const key = hoop === CPU_HOOP ? 'CPU' : 'PLAYER';
      rimFx[key].flash = Math.max(rimFx[key].flash, 12);
      rimFx[key].shake = Math.max(rimFx[key].shake, 8);
      playBounce();
    }
  }
}

function updateBall() {
  if (!ball.active) return;

  // Trail
  ballTrail.push({ x: ball.x, y: ball.y });
  if (ballTrail.length > 8) ballTrail.shift();

  // Physics
  ball.vy += GRAVITY;
  ball.x  += ball.vx;
  ball.y  += ball.vy;
  ball.rotation += ball.vx * 0.08;

  // A live shot scores in the shooter's target hoop. If the ball is a stray
  // loose ball (no shotOwner), it can still bank into either hoop and counts
  // for whoever last touched it.
  const targetHoop = shotOwner === 'player' ? CPU_HOOP
                   : shotOwner === 'cpu'   ? PLAYER_HOOP
                   : null;

  // Score check: prefer the owner's hoop; otherwise allow either hoop for a
  // stray ball and attribute to lastShooter.
  let scoringHoop = null, scoringShooter = null;
  if (targetHoop && checkScore(targetHoop)) {
    scoringHoop = targetHoop; scoringShooter = shotOwner;
  } else if (!targetHoop) {
    if (checkScore(CPU_HOOP)) { scoringHoop = CPU_HOOP; scoringShooter = lastShooter; }
    else if (checkScore(PLAYER_HOOP)) { scoringHoop = PLAYER_HOOP; scoringShooter = lastShooter; }
  }

  if (scoringHoop) {
    const hoop = scoringHoop;
    const shooter = scoringShooter;
    const swish = isSwish(hoop);
    // 3 pts if released from beyond the three-point distance from that hoop.
    const hc = hoopCenter(hoop);
    const releaseDist = Math.abs(shotReleaseX - hc.x);
    const pts = releaseDist > THREE_DIST ? 3 : 2;
    const isPlayer = shooter === 'player';
    const baseColor = isPlayer ? '#00ffff' : '#ff4444';
    const hoopKey = hoop === CPU_HOOP ? 'CPU' : 'PLAYER';

    if (isPlayer) playerScore += pts; else cpuScore += pts;
    scoreFlash = { who: shooter, timer: 45 };

    // Combo / fire tracking
    streak[shooter]++;
    const justCaughtFire = !onFire[shooter] && streak[shooter] >= 3;
    if (streak[shooter] >= 3) onFire[shooter] = true;
    if (justCaughtFire) playFireWhoosh();

    // Floating +2 / +3
    addFloater('+' + pts, ball.x, ball.y - 30, baseColor);

    // Announcer callout
    if (onFire[shooter]) {
      showCallout(HOT_CALLS[Math.floor(Math.random()*HOT_CALLS.length)], '#ff7700', true);
    } else if (swish) {
      showCallout('DOWNTOWN!', baseColor, false);
    } else {
      showCallout(MAKE_CALLS[Math.floor(Math.random()*MAKE_CALLS.length)], '#ffff00', false);
    }

    // Juice
    screenFlash(swish ? baseColor : '#ffffff', swish ? 0.55 : 0.4);
    if (swish) hitStop = 6;
    shakeMag = Math.max(shakeMag, swish ? 9 : 6);
    netFx[hoopKey] = 18;
    crowdHype = 40;
    spawnParticles(ball.x, ball.y);
    if (swish) { playSwish(); setTimeout(() => playScore(), 90); } else playScore();

    ball.active = false;
    ballTrail = [];

    if (playerScore >= WINNING_SCORE || cpuScore >= WINNING_SCORE) {
      stopBeat();
      if (isPlayer) { spawnConfetti(); }
      setTimeout(() => { playWinJingle(); playBuzzer(); gameState = STATE.GAME_OVER; }, 700);
    } else {
      // Change of possession: give ball to the OTHER side at a check spot.
      const other = isPlayer ? 'cpu' : 'player';
      checkPending = other;
      checkDelay = 28;
    }
    return;
  }

  // Rim collisions (both hoops)
  checkRimCollision(CPU_HOOP);
  checkRimCollision(PLAYER_HOOP);

  // Backboard collisions
  checkBackboardCollision(CPU_HOOP, 'right');
  checkBackboardCollision(PLAYER_HOOP, 'left');

  // Floor bounce (loose ball lives on)
  if (ball.y > FLOOR_Y - BALL_R) {
    ball.y = FLOOR_Y - BALL_R;
    if (ball.vy > 1) { ball.vy = -ball.vy * 0.6; playBounce(); }
    else { ball.vy = 0; }
    ball.vx *= 0.92;
    // mark the shot as a confirmed miss once it has bounced (so the shooter's
    // streak resets) — only once per loose-ball sequence
    if (shotOwner && !missRegistered) registerMiss();
  }

  // Side walls — bounce the ball back in so it can't be lost; treat hard exit
  // as out of bounds turnover.
  if (ball.x < COURT_LEFT - 30 || ball.x > COURT_RIGHT + 30) {
    // Out of bounds: award to the side that didn't shoot it last.
    const other = lastShooter === 'player' ? 'cpu' : 'player';
    if (shotOwner && !missRegistered) registerMiss();
    checkPending = other;
    checkDelay = 10;
    ball.active = false;
    return;
  }

  // Settle: if the ball is basically at rest on the floor, reset to a check.
  if (ball.active && Math.abs(ball.vx) < 0.3 && Math.abs(ball.vy) < 0.6
      && ball.y > FLOOR_Y - BALL_R - 2) {
    ball.settleTimer++;
    if (ball.settleTimer > 90) {
      // no one grabbed it — give to defender of wherever it settled
      const other = lastShooter === 'player' ? 'cpu' : 'player';
      checkPending = other;
      checkDelay = 6;
      ball.active = false;
    }
  } else {
    ball.settleTimer = 0;
  }
}

function checkBackboardCollision(hoop, side) {
  const bbX = hoop.backboardX;
  const top = hoop.rimY - 50, bot = hoop.rimY + 50;
  if (ball.y < top || ball.y > bot) return;
  if (side === 'right') {
    if (ball.vx > 0 && ball.x + BALL_R > bbX && ball.x < bbX + 10) {
      ball.x = bbX - BALL_R; ball.vx = -Math.abs(ball.vx) * 0.5;
      touchedRim = true; playBounce();
    }
  } else {
    if (ball.vx < 0 && ball.x - BALL_R < bbX && ball.x > bbX - 10) {
      ball.x = bbX + BALL_R; ball.vx = Math.abs(ball.vx) * 0.5;
      touchedRim = true; playBounce();
    }
  }
}

// Register a confirmed miss (resets the shooter's streak / fire) once.
function registerMiss() {
  missRegistered = true;
  const shooter = shotOwner || lastShooter;
  streak[shooter] = 0;
  onFire[shooter] = false;
  const calls = touchedRim ? MISS_CALLS_RIM : MISS_CALLS_AIR;
  showCallout(calls[Math.floor(Math.random()*calls.length)], '#ff6600', false);
  playMiss();
  shotOwner = null; // becomes a true loose ball; rebound scramble
}

// ─── UPDATE ──────────────────────────────────────────────────────────────────
function update() {
  gameTime++;

  // Hit-stop (slow-motion) — skip most of the simulation for a few frames.
  if (hitStop > 0) {
    hitStop--;
    // Still advance lightweight visual timers so FX don't freeze entirely.
    if (callout.timer > 0) callout.timer--;
    if (flash.timer > 0) flash.timer--;
    updateFx();
    return;
  }

  // Menu demo ball bounce
  if (gameState === STATE.MENU) {
    demoBall.vy += 0.4;
    demoBall.y += demoBall.vy;
    if (demoBall.y > FLOOR_Y - 20) { demoBall.y = FLOOR_Y - 20; demoBall.vy = -9; }
  }

  // Star twinkle
  for (const s of stars) {
    s.bright += (Math.random() - 0.5) * 0.08;
    if (s.bright < 0) s.bright = 0;
    if (s.bright > 1) s.bright = 1;
  }

  updateFx();

  // Fire-mode ball trail particles (live shot by an on-fire shooter)
  if (gameState === STATE.PLAYING && ball.active && shotOwner && onFire[shotOwner]) {
    spawnFireParticle(ball.x, ball.y);
  }
  // Fire aura on the on-ball holder if on fire
  if (gameState === STATE.PLAYING && possession !== 'loose' && onFire[possession]) {
    const h = holderEntity();
    if (h && gameTime % 3 === 0) spawnFireParticle(h.x, h.y);
  }

  // Screen shake
  if (shakeMag > 0) {
    shakeX = (Math.random() - 0.5) * shakeMag * 2;
    shakeY = (Math.random() - 0.5) * shakeMag * 2;
    shakeMag *= 0.75;
    if (shakeMag < 0.5) { shakeMag = 0; shakeX = 0; shakeY = 0; }
  }

  // Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.15;
    p.life -= p.decay;
    if (p.life <= 0) particles.splice(i, 1);
  }

  if (popup.timer > 0) popup.timer--;
  if (scoreFlash.timer > 0) scoreFlash.timer--;
  if (callout.timer > 0) callout.timer--;
  if (flash.timer > 0) flash.timer--;

  if (gameState !== STATE.PLAYING) return;

  // Brief check-ball hand-off after a make/miss/OOB.
  if (checkDelay > 0) {
    checkDelay--;
    if (checkDelay === 0 && checkPending) {
      giveBall(checkPending, true);
      checkPending = null;
    }
  }
  if (checkTimer > 0) { checkTimer--; }

  // Dribble animation phase
  dribblePhase += 0.35;

  // Possession / shot clock (only while someone holds the ball)
  if (possession !== 'loose' && checkTimer <= 0 && checkDelay <= 0) {
    shotClock--;
    const secLeft = Math.ceil(shotClock / 60);
    if (secLeft <= 3 && secLeft > 0 && secLeft !== lastClockBeepSec) {
      lastClockBeepSec = secLeft;
      playBeep(secLeft === 1 ? 1320 : 990);
    }
    if (shotClock <= 0) {
      // Shot-clock violation = turnover (NOT a freeze).
      const offender = possession;
      streak[offender] = 0; onFire[offender] = false;
      showCallout('SHOT CLOCK!', '#ff3333', false);
      checkPending = offender === 'player' ? 'cpu' : 'player';
      checkDelay = 14;
      possession = 'loose';
      ball.active = false;
    }
  }

  // Entity control & AI
  updatePlayerControls();
  updateCpuAI();

  // Physics for both entities
  applyEntityPhysics(player);
  applyEntityPhysics(cpu);

  // Ball: held (stick to holder) or loose (free physics)
  if (possession === 'loose' && ball.active) {
    updateBall();
    // Rebound / pickup attempts (only once the ball is no longer the live
    // upward shot — i.e., it's coming down or has been missed/loosened).
    if (ball.active && (shotOwner === null || ball.vy > 0)) {
      // The shooter can't instantly re-grab their own rising shot.
      tryPickup(player, 'player');
      if (possession === 'loose') tryPickup(cpu, 'cpu');
    }
  } else if (possession !== 'loose') {
    attachBallToHolder();
  }
}

// Update floaters, confetti, and decaying FX timers (runs even during hit-stop).
function updateFx() {
  for (let i = floaters.length - 1; i >= 0; i--) {
    const f = floaters[i];
    f.y += f.vy; f.life--;
    if (f.life <= 0) floaters.splice(i, 1);
  }
  for (let i = confetti.length - 1; i >= 0; i--) {
    const c = confetti[i];
    c.x += c.vx; c.y += c.vy; c.vy += 0.04; c.rot += c.vr;
    if (c.y > H + 20) {
      if (gameState === STATE.GAME_OVER) { c.y = -10; c.vy = Math.random()*2+1; c.x = Math.random()*W; }
      else confetti.splice(i, 1);
    }
  }
  if (rimFx.CPU.flash > 0)    rimFx.CPU.flash--;
  if (rimFx.CPU.shake > 0)    rimFx.CPU.shake--;
  if (rimFx.PLAYER.flash > 0) rimFx.PLAYER.flash--;
  if (rimFx.PLAYER.shake > 0) rimFx.PLAYER.shake--;
  if (netFx.CPU > 0)    netFx.CPU--;
  if (netFx.PLAYER > 0) netFx.PLAYER--;
  if (crowdHype > 0)    crowdHype--;
}

// ─── DRAW HELPERS ────────────────────────────────────────────────────────────
function drawBackground() {
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0,   '#050510');
  grad.addColorStop(0.6, '#0a0a20');
  grad.addColorStop(1,   '#0d0d28');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Stars
  for (const s of stars) {
    ctx.fillStyle = `rgba(255,255,255,${0.4 + s.bright * 0.6})`;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
  }

  // City skyline
  for (const b of skyline) {
    ctx.fillStyle = b.color;
    ctx.fillRect(b.x, b.y, b.w, b.h);
  }
  // Draw moon
  ctx.fillStyle = '#ffffcc';
  ctx.shadowBlur = 12; ctx.shadowColor = '#ffffaa';
  ctx.beginPath(); ctx.arc(120, 60, 18, 0, Math.PI * 2); ctx.fill();
  ctx.shadowBlur = 0;
  // Moon crater
  ctx.fillStyle = '#eeeebb';
  ctx.beginPath(); ctx.arc(126, 55, 5, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(114, 65, 3, 0, Math.PI * 2); ctx.fill();
}

function drawFloor() {
  const floorGrad = ctx.createLinearGradient(0, FLOOR_Y, 0, H);
  floorGrad.addColorStop(0,   '#8B5E2F');
  floorGrad.addColorStop(0.3, '#7A4F25');
  floorGrad.addColorStop(1,   '#3A1F08');
  ctx.fillStyle = floorGrad;
  ctx.fillRect(0, FLOOR_Y, W, H - FLOOR_Y);

  // Plank lines
  ctx.strokeStyle = 'rgba(0,0,0,0.3)';
  ctx.lineWidth = 1;
  for (let y = FLOOR_Y + 8; y < H; y += 12) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }

  // Center line
  ctx.strokeStyle = 'rgba(255,255,255,0.25)';
  ctx.lineWidth = 2;
  ctx.setLineDash([10, 10]);
  ctx.beginPath(); ctx.moveTo(W/2, FLOOR_Y); ctx.lineTo(W/2, H); ctx.stroke();
  ctx.setLineDash([]);

  // Three-point arcs — glowing & pulsing
  const pulse = 0.35 + Math.sin(gameTime * 0.06) * 0.2;
  ctx.save();
  ctx.strokeStyle = `rgba(0,255,255,${pulse})`;
  ctx.shadowBlur = 12 + Math.sin(gameTime * 0.06) * 6;
  ctx.shadowColor = '#00ffff';
  ctx.lineWidth = 2.5;
  // Player side (right arc from left)
  ctx.beginPath();
  ctx.arc(80, FLOOR_Y, 160, -Math.PI/2, 0);
  ctx.stroke();
  // CPU side (left arc from right)
  ctx.beginPath();
  ctx.arc(720, FLOOR_Y, 160, Math.PI, Math.PI + Math.PI/2);
  ctx.stroke();
  ctx.restore();

  // Center circle
  ctx.beginPath();
  ctx.arc(W/2, FLOOR_Y + 45, 45, 0, Math.PI * 2);
  ctx.stroke();
}

function drawHoop(hoop, side) {
  const bbX = hoop.backboardX;
  const bw = 8, bh = 100;

  // Pole
  ctx.fillStyle = '#888';
  if (side === 'right') {
    ctx.fillRect(bbX + 2, hoop.rimY + 52, 5, FLOOR_Y - hoop.rimY - 52);
  } else {
    ctx.fillRect(bbX - 7, hoop.rimY + 52, 5, FLOOR_Y - hoop.rimY - 52);
  }

  // Backboard
  ctx.fillStyle = '#e0e0e0';
  if (side === 'right') {
    ctx.fillRect(bbX, hoop.rimY - bh/2, bw, bh);
    // Inner square
    ctx.strokeStyle = '#ff2222'; ctx.lineWidth = 2;
    ctx.strokeRect(bbX + 1, hoop.rimY - 20, bw - 2, 40);
    // Rim support arm
    ctx.fillStyle = '#aaa';
    ctx.fillRect(hoop.rimX2, hoop.rimY - 3, bbX - hoop.rimX2, 6);
  } else {
    ctx.fillRect(bbX - bw, hoop.rimY - bh/2, bw, bh);
    ctx.strokeStyle = '#ff2222'; ctx.lineWidth = 2;
    ctx.strokeRect(bbX - bw + 1, hoop.rimY - 20, bw - 2, 40);
    ctx.fillStyle = '#aaa';
    ctx.fillRect(hoop.rimX1, hoop.rimY - 3, bbX - hoop.rimX1, 6);
  }

  // Rim with neon glow (flickering + flash on a make)
  const key = hoop === CPU_HOOP ? 'CPU' : 'PLAYER';
  const flashAmt = rimFx[key].flash / 12;
  const rimShake = rimFx[key].shake > 0 ? (Math.random() - 0.5) * 4 : 0;
  const flicker = 12 + Math.sin(gameTime * 0.4 + bbX) * 4 + Math.random() * 3;
  ctx.save();
  ctx.shadowBlur = flashAmt > 0 ? 25 : flicker;
  ctx.shadowColor = flashAmt > 0 ? '#ffff00' : '#00ffff';
  ctx.strokeStyle = flashAmt > 0
    ? `rgb(255,${Math.floor(150 + flashAmt*105)},${Math.floor(flashAmt*120)})`
    : '#ff4400';
  ctx.lineWidth = 4 + flashAmt * 2;
  ctx.beginPath();
  ctx.moveTo(hoop.rimX1, hoop.rimY + rimShake);
  ctx.lineTo(hoop.rimX2, hoop.rimY + rimShake);
  ctx.stroke();
  ctx.restore();

  // Net — swishes/stretches downward briefly when ball passes through
  const swish = netFx[key] / 18;
  ctx.strokeStyle = swish > 0 ? `rgba(255,255,255,${0.5 + swish*0.4})` : 'rgba(255,255,255,0.5)';
  ctx.lineWidth = 1;
  const netTop = hoop.rimY + rimShake;
  const netBot = hoop.rimY + 35 + swish * 18;
  const midX   = (hoop.rimX1 + hoop.rimX2) / 2;
  const sway    = Math.sin(gameTime * 0.5) * swish * 4;
  for (let nx = hoop.rimX1; nx <= hoop.rimX2; nx += 8) {
    const offset = (nx - midX) * 0.35;
    ctx.beginPath();
    ctx.moveTo(nx, netTop);
    ctx.lineTo(midX + offset * 0.4 + sway, netBot);
    ctx.stroke();
  }
  for (let row = 0; row <= 3; row++) {
    const t  = row / 3;
    const x1 = hoop.rimX1 + (midX - hoop.rimX1) * t * 0.35;
    const x2 = hoop.rimX2 - (hoop.rimX2 - midX) * t * 0.35;
    ctx.beginPath();
    ctx.moveTo(x1, netTop + t * (netBot - netTop));
    ctx.lineTo(x2, netTop + t * (netBot - netTop));
    ctx.stroke();
  }
}

function drawLampPost(x) {
  ctx.fillStyle = '#666';
  ctx.fillRect(x - 3, 190, 6, FLOOR_Y - 190);
  ctx.fillStyle = '#888';
  ctx.fillRect(x - 22, 183, 44, 11);
  // Light cone
  const coneGrad = ctx.createRadialGradient(x, 193, 0, x, 193, 130);
  coneGrad.addColorStop(0, 'rgba(255,240,160,0.2)');
  coneGrad.addColorStop(1, 'rgba(255,240,160,0)');
  ctx.fillStyle = coneGrad;
  ctx.beginPath();
  ctx.moveTo(x, 193);
  ctx.lineTo(x - 90, FLOOR_Y);
  ctx.lineTo(x + 90, FLOOR_Y);
  ctx.closePath(); ctx.fill();
  // Bulb
  ctx.fillStyle = 'rgba(255,245,180,0.95)';
  ctx.shadowBlur = 12; ctx.shadowColor = '#ffee99';
  ctx.beginPath(); ctx.arc(x, 193, 6, 0, Math.PI * 2); ctx.fill();
  ctx.shadowBlur = 0;
}

function drawCrowd() {
  const hype = crowdHype / 40;
  for (let i = 0; i < crowd.length; i++) {
    const c = crowd[i];
    // Crowd jumps (offset upward) and brightens when hyped
    const jump = hype > 0 ? Math.abs(Math.sin(gameTime * 0.4 + i)) * hype * 8 : 0;
    const cy = c.y - jump;
    const bodyAlpha = 0.95;
    ctx.fillStyle = `rgba(${15 + hype*60},${15 + hype*60},${35 + hype*60},${bodyAlpha})`;
    ctx.beginPath(); ctx.arc(c.x, cy, c.r, 0, Math.PI * 2); ctx.fill();
    ctx.fillRect(c.x - c.r * 0.6, cy, c.r * 1.2, c.r * 1.6);
    // Colored shirt (brighter on hype)
    const hue = (c.x * 3.7) % 360;
    ctx.fillStyle = `hsla(${hue},70%,55%,${0.3 + hype*0.5})`;
    ctx.fillRect(c.x - c.r * 0.55, cy, c.r * 1.1, c.r * 1.4);
  }
}

// Draw an entity with run / jump / shoot poses derived from its state.
function drawPlayerFigure(e, isPlayer) {
  const x = e.x, y = e.y;
  const bodyColor   = isPlayer ? '#2255ff' : '#cc1111';
  const skinColor   = '#f5c5a0';
  const shortsColor = isPlayer ? '#ffffff' : '#222222';
  const f = e.facing || 1;

  const shooting = e.shootAnim > 0.05;
  const jumping  = !e.onGround;
  const running  = e.onGround && Math.abs(e.vx) > 0.4;
  const legSwing = running ? Math.sin(e.runPhase) * 7 : 0;

  // Shadow (shrinks while airborne)
  const airT = jumping ? Math.max(0, Math.min(1, (FLOOR_Y - P_H - y) / 80)) : 0;
  ctx.fillStyle = `rgba(0,0,0,${0.3 - airT * 0.2})`;
  const groundY = jumping ? FLOOR_Y : y + 62;
  ctx.beginPath(); ctx.ellipse(x, groundY, 18 - airT * 6, 5 - airT * 2, 0, 0, Math.PI * 2); ctx.fill();

  // Legs / shorts
  ctx.fillStyle = shortsColor;
  if (jumping) {
    // tucked legs
    ctx.fillRect(x - 9, y + 26, 8, 20);
    ctx.fillRect(x + 1, y + 26, 8, 20);
  } else {
    ctx.fillRect(x - 9 - legSwing, y + 28, 8, 28);
    ctx.fillRect(x + 1 + legSwing, y + 28, 8, 28);
  }
  ctx.fillRect(x - 12, y + 22, 24, 10);

  // Shoes
  ctx.fillStyle = isPlayer ? '#111188' : '#881111';
  if (jumping) {
    ctx.fillRect(x - 13, y + 44, 12, 6);
    ctx.fillRect(x + 1,  y + 44, 12, 6);
  } else {
    ctx.fillRect(x - 15 - legSwing, y + 56, 12, 7);
    ctx.fillRect(x + 3 + legSwing,  y + 56, 12, 7);
  }

  // Body/jersey
  ctx.fillStyle = bodyColor;
  ctx.fillRect(x - 11, y - 2, 22, 26);

  // Arms
  ctx.fillStyle = skinColor;
  if (shooting || (jumping && (possession === sideOf(e)))) {
    // both arms up (shooting / going for layup-dunk)
    ctx.fillRect(x + f * 8 - 3, y - 18, 7, 26);
    ctx.fillRect(x - f * 14 - 3, y - 6, 7, 18);
  } else if (running) {
    ctx.fillRect(x + 11, y + 2 + legSwing, 7, 15);
    ctx.fillRect(x - 18, y + 2 - legSwing, 7, 15);
  } else {
    ctx.fillRect(x + 11, y + 2, 7, 16);
    ctx.fillRect(x - 18, y + 2, 7, 16);
  }

  // Head
  ctx.fillStyle = skinColor;
  ctx.beginPath(); ctx.arc(x, y - 12, 11, 0, Math.PI * 2); ctx.fill();

  // Headband
  ctx.fillStyle = isPlayer ? '#ffdd00' : '#ffffff';
  ctx.fillRect(x - 11, y - 20, 22, 5);

  // Jersey number
  ctx.fillStyle = '#fff';
  ctx.font = '7px "Press Start 2P"';
  ctx.textAlign = 'center';
  ctx.fillText(isPlayer ? '1' : '2', x, y + 14);
}

function drawBall() {
  if (gameState !== STATE.PLAYING) return;

  // Trail
  for (let i = 0; i < ballTrail.length; i++) {
    const alpha = (i / ballTrail.length) * 0.4;
    const r = BALL_R * ((i + 1) / ballTrail.length) * 0.65;
    ctx.fillStyle = `rgba(255,100,0,${alpha})`;
    ctx.beginPath(); ctx.arc(ballTrail[i].x, ballTrail[i].y, r, 0, Math.PI * 2); ctx.fill();
  }

  const fireSide = shotOwner || (possession !== 'loose' ? possession : null);
  const fired = fireSide && onFire[fireSide];
  ctx.save();
  ctx.shadowBlur = fired ? 28 + Math.random()*8 : 15;
  ctx.shadowColor = fired ? '#ff3300' : '#ff6600';
  ctx.translate(ball.x, ball.y);
  ctx.rotate(ball.rotation);

  const ballGrad = ctx.createRadialGradient(-3, -3, 1, 0, 0, BALL_R);
  if (fired) {
    ballGrad.addColorStop(0, '#ffdd33');
    ballGrad.addColorStop(1, '#ff3300');
  } else {
    ballGrad.addColorStop(0, '#ff9955');
    ballGrad.addColorStop(1, '#cc3300');
  }
  ctx.fillStyle = ballGrad;
  ctx.beginPath(); ctx.arc(0, 0, BALL_R, 0, Math.PI * 2); ctx.fill();
  ctx.shadowBlur = 0;

  // Seams
  ctx.strokeStyle = 'rgba(0,0,0,0.5)';
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(0, 0, BALL_R, 0, Math.PI); ctx.stroke();
  ctx.beginPath(); ctx.arc(0, 0, BALL_R, Math.PI/2, -Math.PI/2); ctx.stroke();

  ctx.restore();
}

function drawAimArc() {
  // Show a charge power indicator above the player while charging a shot.
  if (gameState !== STATE.PLAYING) return;
  if (!(player.charging && possession === 'player')) return;
  const bx = player.x, by = player.y - 34;
  const pct = player.power / 100;
  // Power bar
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.fillRect(bx - 22, by, 44, 7);
  const rr = Math.floor(pct * 255);
  const gg = Math.floor((1 - Math.abs(pct - 0.85)) * 220);
  ctx.fillStyle = `rgb(${rr},${gg},40)`;
  ctx.fillRect(bx - 21, by + 1, 42 * pct, 5);
  // Sweet-spot marker (~85% = ideal)
  ctx.strokeStyle = '#00ffff'; ctx.lineWidth = 1.5;
  ctx.strokeRect(bx - 22, by, 44, 7);
  ctx.fillStyle = '#00ffff';
  ctx.fillRect(bx - 22 + 44 * 0.85, by - 2, 2, 11);
  ctx.restore();
}

// ─── ARCADE FX RENDERING ─────────────────────────────────────────────────────
function drawCallout() {
  if (callout.timer <= 0) return;
  // Slam-in scale: overshoot then settle.
  const t = (75 - callout.timer) / 75;
  const slam = callout.timer > 60 ? 1.6 - (75 - callout.timer) / 15 * 0.6 : 1;
  const alpha = callout.timer < 15 ? callout.timer / 15 : 1;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(W / 2, 150);
  ctx.scale(slam, slam);
  const wob = callout.hot ? Math.sin(gameTime * 0.5) * 0.08 : 0;
  ctx.rotate(wob);
  ctx.font = '26px "Press Start 2P"';
  ctx.textAlign = 'center';
  ctx.lineWidth = 4;
  ctx.strokeStyle = '#000';
  ctx.shadowBlur = 24; ctx.shadowColor = callout.color;
  ctx.fillStyle = callout.hot
    ? `hsl(${(gameTime*8)%60},100%,55%)`
    : callout.color;
  ctx.strokeText(callout.text, 0, 0);
  ctx.fillText(callout.text, 0, 0);
  ctx.restore();
}

  ctx.fillText('MUTED [M]', 8, H - 10);
  ctx.restore();
}

// ─── MAIN RENDER ─────────────────────────────────────────────────────────────
function render() {
  ctx.save();
  ctx.translate(shakeX, shakeY);

  drawBackground();
  drawCrowd();
  drawFloor();
  drawLampPost(255);
  drawLampPost(545);
  drawHoop(CPU_HOOP,    'right');
  drawHoop(PLAYER_HOOP, 'left');

  if (gameState === STATE.PLAYING) {
    // Draw the back player first for depth (the one further from camera-ish).
    drawPlayerFigure(player, true);
    drawPlayerFigure(cpu,    false);
  }

  drawAimArc();
  drawBall();
  drawParticles();

  if (gameState === STATE.PLAYING) {
    drawScoreboard();
    drawTurnIndicator();
    drawShotClock();
    drawControlsHint();
  }

  drawFloaters();
  drawPopup();
  drawCallout();
  ctx.restore();

  // Full-screen overlays (not shaken)
  drawScreenFlash();
  if (confetti.length) drawConfetti();

  if (gameState === STATE.MENU)      drawMenuScreen();
  if (gameState === STATE.GAME_OVER) drawGameOverScreen();

  drawMuteIndicator();
}

// ─── GAME LOOP ───────────────────────────────────────────────────────────────
function gameLoop() {
  update();
  render();
  requestAnimationFrame(gameLoop);
}

// Initial ball position for menu display
ball.x = W / 2;
ball.y = FLOOR_Y - 20;

gameLoop();
</script>
</body>
